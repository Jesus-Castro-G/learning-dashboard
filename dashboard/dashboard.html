<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Progreso de Aprendizaje</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h2 {
            text-align: center;
        }
        canvas {
            max-width: 700px;
            margin: auto;
        }
    </style>
</head>
<body>
    <h2>Progreso de Usuarios</h2>
    <canvas id="graficoProgreso"></canvas>

    <script>
        const nombres = ["Ana Gómez", "Luis Martínez", "Carla Reyes", "David Torres"];
        const porcentajes = [85, 72, 93, 66];

        const ctx = document.getElementById('graficoProgreso').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: nombres,
                datasets: [{
                    label: '% Completado',
                    data: porcentajes,
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });
    </script>
</body>
</html>
